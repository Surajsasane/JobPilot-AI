name: JobPilot CI

on:
  push:
    branches: [main, feature/user-profile-preferences]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: Import FastAPI app and configure ORM mappers
        working-directory: backend
        run: python -c "from app.main import app; from sqlalchemy.orm import configure_mappers; configure_mappers(); print(f\x27Loaded {len(app.routes)} routes\x27)"
